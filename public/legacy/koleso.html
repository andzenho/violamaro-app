  const n = el(`
    <div class="card">
      ${stripHtml()}
      <div class="step">Терапевтический онлайн-уикенд «Неудобные»</div>
      <h2>Занимаем ваше место</h2>
      <p class="lede">Осталось только заполнить данные о вас, чтобы мы вас не потеряли и вы точно получили доступ к программе.</p>
      ${known && tgName
        ? `<p class="lede">Записываем как <b>${known}</b>, ${tgName}. Если что-то не так, поправьте.</p>`
        : ""}
      <div class="fields">
        <label>Как вас зовут
          <input id="f-name" type="text" value="${known}" placeholder="Имя" autocomplete="name">
        </label>
        <label>Телеграм
          <input id="f-tg" type="text" value="${tgName}" placeholder="@имя" autocomplete="off">
        </label>
        <!-- Телефона здесь нет намеренно: его собирает страница оплаты
             на GetPlatinum. Третье поле в форме стоит конверсии, а номер
             всё равно приедет через минуту вместе с оплатой. -->
      </div>
      <p class="promise">Уикенд проходит в закрытом Телеграм-канале. Ссылка на него приходит сразу после оплаты. Если она почему-то не пришла, отдел заботы напишет вам сам, но вы всегда можете написать первыми, и вам ответят. Мы проверяем каждую оплату руками и не закрываем вопрос, пока вы не зашли и не разобрались, как всё устроено.</p>
      <p class="quiet">Отдел заботы: <a href="${CONFIG.careChat}" target="_blank" rel="noopener">${CONFIG.careChat.replace("https://t.me/", "@")}</a></p>
      <div class="consents">
        <label class="cb" id="cb-pd-l">
          <input type="checkbox" id="cb-pd">
          <span>Я даю <a href="${CONFIG.docs.consent}" target="_blank" rel="noopener">согласие</a> на обработку моих персональных данных и ознакомлен(а) с <a href="${CONFIG.docs.privacy}" target="_blank" rel="noopener">Политикой обработки персональных данных</a>.</span>
        </label>
        <label class="cb">
          <input type="checkbox" id="cb-ads">
          <span>Я хочу получать письма и сообщения о программах и эфирах. Отписаться можно в один клик. <a href="${CONFIG.docs.ads}" target="_blank" rel="noopener">Условия рассылки</a></span>
        </label>
      </div>
      <div class="foot">
        <button class="go big" id="send">Дальше, к оплате&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note" id="hint">Дальше выберете, чем платить. Рублями или в долларах, оба способа рабочие.</p>
        <button class="ghost" id="back-offer">← Назад</button>
      </div>
    </div>`);

  const nameEl = n.querySelector("#f-name");
  const tgEl = n.querySelector("#f-tg");
  const btn = n.querySelector("#send");
  const hint = n.querySelector("#hint");
  const pd = n.querySelector("#cb-pd");
  const pdLabel = n.querySelector("#cb-pd-l");
  const ads = n.querySelector("#cb-ads");
  const hintText = hint ? hint.textContent : "";

  function clearWarn() {
    if (hint) { hint.classList.remove("err"); hint.textContent = hintText; }
    nameEl.classList.remove("err");
    tgEl.classList.remove("err");
    if (pdLabel) pdLabel.classList.remove("err");
  }
  function warn(msg) { if (hint) { hint.textContent = msg; hint.classList.add("err"); } }

  [nameEl, tgEl].forEach(f => f.addEventListener("input", () => { if (f.value.trim()) f.classList.remove("err"); }));
  if (pd) pd.addEventListener("change", () => { if (pd.checked) clearWarn(); });

  /* Заявку отправляем здесь, а не на экране выбора способа. Человек,
     который заполнил форму и завис над выбором валюты, — самый тёплый
     из всех, и терять его контакт из-за лишнего экрана нельзя. */
  btn.addEventListener("click", () => {
    const name = (nameEl.value || "").trim();
    const contact = ник_(tgEl.value);
    if (contact && contact !== tgEl.value.trim()) tgEl.value = contact;
    if (!name || !contact) {
      if (!name) nameEl.classList.add("err");
      if (!contact) tgEl.classList.add("err");
      warn("Заполните оба поля, иначе мы не найдём вас после оплаты.");
      (name ? tgEl : nameEl).focus();
      return;
    }
    if (pd && !pd.checked) {
      pdLabel.classList.add("err");
      if (pdLabel.scrollIntoView) pdLabel.scrollIntoView({ behavior: "smooth", block: "center" });
      warn("Отметьте согласие на обработку персональных данных.");
      return;
    }
    clearWarn();
    btn.disabled = true;
    запомнитьКонтакт_(name, contact);
    sendGo(r, name, contact, { pd: !!(pd && pd.checked), ads: !!(ads && ads.checked) });
    payway(r);
  });
  n.querySelector("#back-offer").addEventListener("click", () => offerSobytie(r));
  render(n);
  runStrip(n);
}

/* Экран выбора способа оплаты.
   Аудитория делится примерно пополам на тех, кто платит российской картой,
   и тех, у кого её нет. Поэтому способы равны: одинаковые карточки,
   одинаковые кнопки, одинаковый вес. Любая подсказка «вот этот основной»
   половине людей говорит, что они здесь второй сорт. */
function payway(r) {
  stage = "payway";
  const usdLive = !!CONFIG.payUrlUsd;

  const n = el(`
    <div class="card">
      ${stripHtml()}
      <div class="step">Терапевтический онлайн-уикенд «Неудобные»</div>
      <h2>Чем вам удобнее заплатить</h2>
      <p class="lede">Оба способа открывают доступ одинаково. Выбирайте тот, которым платить проще.</p>
      <div class="ways">
        <div class="way">
          <div class="way-sum">${CONFIG.price}</div>
          <div class="way-what">Российской картой</div>
          <p class="way-note">На странице оплаты можно оформить рассрочку.</p>
          <button class="go big" id="pay-rub">Оплатить рублями&nbsp;<span aria-hidden="true">→</span></button>
        </div>
        <div class="way">
          <div class="way-sum">${CONFIG.priceUsd}</div>
          <div class="way-what">Зарубежной картой</div>
          <p class="way-note">${usdLive
            ? "Оплата через Lava, карты любой страны."
            : "Отдел заботы пришлёт ссылку на оплату, напишите ему."}</p>
          <button class="go big" id="pay-usd">Оплатить в долларах&nbsp;<span aria-hidden="true">→</span></button>
        </div>
      </div>
      <p class="cta-note" id="pw-hint">Оплата откроется в отдельном окне, там же условия участия.</p>
      <p class="quiet">Что-то не проходит, напишите нам: <a href="${CONFIG.careChat}" target="_blank" rel="noopener">${CONFIG.careChat.replace("https://t.me/", "@")}</a></p>
      <button class="ghost" id="back-lead">← Назад</button>
    </div>`);

  const hint = n.querySelector("#pw-hint");
  const hintWas = hint ? hint.textContent : "";
  const buttons = [].slice.call(n.querySelectorAll(".way button.go"));
  const labels = buttons.map(x => x.innerHTML);

  /* Возвращаем кнопки в рабочее состояние. Человек уходит на оплату
     и часто возвращается: передумал, не прошла карта, хочет другую валюту.
     Раньше кнопки гасились навсегда, и нажать на этом экране было уже
     нечего — тупик ровно в том месте, где человек готов заплатить. */
  function unlock() {
    buttons.forEach((x, i) => { x.disabled = false; x.innerHTML = labels[i]; });
    if (hint) hint.textContent = hintWas;
  }

  function go(way, btn) {
    /* Гасим на пару секунд, чтобы двойное нажатие не отправило способ дважды
       и не открыло два окна. Дальше кнопки снова живые. */
    buttons.forEach(x => { x.disabled = true; });
    btn.textContent = (way === "usd" && !usdLive) ? "Открываю чат…" : "Открываю оплату…";
    openPay(way);
    if (hint) hint.textContent = "Если окно не открылось, проверьте, не заблокировал ли его браузер.";
    setTimeout(unlock, 2500);
  }

  /* И на всякий случай возвращаем кнопки сразу, как только человек снова
     смотрит на приложение: из окна оплаты он может вернуться и раньше. */
  const wake = () => { if (!document.hidden) unlock(); };
  document.addEventListener("visibilitychange", wake);
  window.addEventListener("focus", wake);

  n.querySelector("#pay-rub").addEventListener("click", e => go("rub", e.currentTarget));
  n.querySelector("#pay-usd").addEventListener("click", e => go("usd", e.currentTarget));
  n.querySelector("#back-lead").addEventListener("click", () => leadSobytie(r));
  render(n);
  runStrip(n);
}

/* Уводим на оплату. Способов два: рублями и в долларах. Если адреса под
   способ нет — в чат с командой, чтобы кнопка не вела в никуда.
   К адресу оплаты дописываем k, src и test: это следующий шаг воронки, и
   без меток он не знает, чей это платёж и откуда человек пришёл. В чат
   с командой sMetkami_ ничего не дописывает — там параметрам делать нечего. */
function openPay(way) {
  const url = (way === "usd" ? CONFIG.payUrlUsd : CONFIG.payUrl)
    || CONFIG.careChat || CONFIG.teamChat;
  if (!url) return;
  window.open(sMetkami_(url), "_blank", "noopener");
}

/* Отметка «пошёл платить». Формы здесь нет, контакт оставляет сама оплата, —
   но без этой записи мы не знаем, кто дошёл до кнопки и не дошёл до оплаты. */
function sendGo(r, name, contact, consent) {
  /* Своё место в счётчике. Единственная настоящая единица в нём. */
  try { localStorage.setItem("viola-kl-zayavka", "1"); } catch (e) {}
  track_("lead", {
    anketa: "sobytie",
    name: name || "", contact: contact || "",
    otdayu: r ? r.out : "",
    ostaetsya: r ? r.inn : "",
    worst: r ? r.worst.map(c => c.k).join(",") : "",
    otkuda: r ? "test" : "pryamaya-ssylka",
    forks: forks,
    /* Акцепт оферты собирает страница оплаты на GetCourse: там же деньги,
       там же и договор. Дважды за минуту принимать один документ незачем. */
    accept_pd: consent && consent.pd ? "да" : "",
    accept_ads: consent && consent.ads ? "да" : "",
    consent_ts: new Date().toISOString(),
    doc_version_consent: CONFIG.docVersionConsent || ""
  }, { name: name, contact: contact });
}

/* ——— кто открыл тест ———
   Раньше человека называл Телеграм. Теперь его называет ссылка:
   ?k=tg_12345 — разовый ключ от бота, это platform_user_id с префиксом
   платформы; ?src=tg-bot — метка источника. Оба кладём в sessionStorage:
   человек листает результат, уходит на оффер и возвращается — адрес
   к этому моменту уже может быть без параметров, а связка нужна до конца. */
const K_KEY = "viola-k";
const SRC_KEY = "viola-src";
const ANON_KEY = "viola-anon";
const U_KEY = "viola-u";
const N_KEY = "viola-n";

function izAdresa_(имя, ключ) {
  let v = "";
  try { v = new URLSearchParams(location.search).get(имя) || ""; } catch (e) {}
  try {
    if (v) sessionStorage.setItem(ключ, v);
    else v = sessionStorage.getItem(ключ) || "";
  } catch (e) {}
  return v;
}

/* Читаем всё сразу при запуске, а не при первом событии: человек может
   перезагрузить страницу раньше, чем что-то отправится, — и адрес к тому
   моменту уже будет без параметров, а сохранить их будет некому. */
const K = izAdresa_("k", K_KEY);
const SRC = izAdresa_("src", SRC_KEY);
// u — логин в мессенджере (без @), n — имя. Бот подставляет их в ссылку
// сам, как k и src: тогда колонки «Логин»/«Имя» на листах тестов заполнятся
// уже с первого события, а не только если человек потом оставит заявку.
const U = izAdresa_("u", U_KEY);
const N = izAdresa_("n", N_KEY);

/* Метка источника. Раньше приходила из start_param мини-аппа, теперь из
   адреса. Отдаём как есть: что из неё принять, решает сервер. */
function istochnik_() { return SRC; }

/* Свой id для пришедших без ключа. Без него три события одного анонимного
   прохождения легли бы в базу тремя разными людьми. Когда человек позже
   откроет тест по ссылке из бота, сервер по этому же id сведёт прежние
   события с опознанной записью — воронка не порвётся. */
function anonId_() {
  try {
    let v = localStorage.getItem(ANON_KEY);
    if (!v) {
      v = "web_" + (Date.now().toString(36) + Math.random().toString(36).slice(2))
        .replace(/[^a-z0-9]/g, "").slice(0, 24);
      localStorage.setItem(ANON_KEY, v);
    }
    return v;
  } catch (e) { return ""; }
}

/* Дописываем метки к внешнему адресу, на который уводим человека: следующий
   шаг воронки должен знать, чей это переход и откуда. Адреса без параметров
   (t.me, чат заботы) не трогаем — там меткам делать нечего. */
function sMetkami_(url) {
  if (!url || url.indexOf("http") !== 0 || url.indexOf("t.me/") !== -1) return url;
  try {
    const u = new URL(url);
    if (K) u.searchParams.set("k", K);
    if (SRC) u.searchParams.set("src", SRC);
    u.searchParams.set("test", "koleso");
    return u.toString();
  } catch (e) { return url; }
}

/* ——— события ———
   Ключа API у страницы нет и быть не может: она открыта в браузере.
   Поэтому шлём на /api/track — он проверяет каждое поле и сам подставляет
   секрет уже на сервере.
   keepalive обязателен: test_done и offer_view уходят ровно в тот момент,
   когда человек кликает дальше, и обычный запрос браузер бы оборвал.
   Обёртка не про сеть, а про сам вызов: fetch есть не в каждом вебвью,
   и без неё исключение ушло бы вверх — человек вместо теста получил бы
   экран отказа из-за одного неотправленного события. */
function track_(тип, payload, ещё) {
  const body = {
    type: тип,
    test: "koleso",
    k: K,
    anon_id: anonId_(),
    source: istochnik_(),
    u: U,
    n: N,
    payload: payload || null
  };
  if (ещё) Object.keys(ещё).forEach(k => { body[k] = ещё[k]; });
  try {
    return fetch("/api/track", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      keepalive: true
    }).catch(() => {});
  } catch (e) { return Promise.resolve(); }
}

/* Пинг «открыл первый вопрос». Бот по нему отличает «не открывал тест»
   от «начал и бросил» и шлёт разный текст. Один раз за жизнь страницы:
   человек, вернувшийся к незаконченному тесту, попадает сразу на вопрос,
   кнопку «Начать» не жмёт, второго пинга не будет. */
let pinged = false;
function pingStart_() {
  if (pinged) return;
  pinged = true;
  track_("test_open");
}

/* Долистал до экрана программы. Экранов-офферов здесь два — практикум и
   событие, — но просмотр считаем один раз за жизнь страницы: между ними
   и результатом можно ходить кнопками сколько угодно. */
let offerSeen = false;
function pingOffer_() {
  if (offerSeen) return;
  offerSeen = true;
  track_("offer_view");
}

/* ——— отправка результата ———
   Уходит всё сырьё для калибровки: колесо по сферам, провалы, ответы.
   Секунды и монотонность нужны, чтобы отличить честное прохождение от
   прокликанного. */
function send(r) {
  const seconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;
  const same = answers.length && answers.every(x => x === answers[0]);

  const payload = {
    seconds: seconds,
    fast: seconds > 0 && seconds < 25,   // 24 вопроса быстрее 25 секунд — читать человек не успевал
    monotone: same,                      // одна и та же кнопка на всё
    otdayu: r.out,
    ostaetsya: r.inn,
    zazor: r.gap,
    wheel: r.wheel.map(c => ({ k: c.k, out: c.out, inn: c.inn })),
    worst: r.worst.map(c => c.k).join(","),
    forks: forks,
    answers: answers.slice()
  };
  window.__result = payload;

  track_("test_done", payload);
}

/* ——— сохранение прогресса ———
   Мини-апп внутри Телеграма может перезагрузиться сам: свернули и вернулись,
   система выгрузила вкладку из памяти, сработал жест закрытия. Страница при этом
   стартует заново, и без сохранения человек оказывается в начале теста.
   Держим ответы в памяти браузера и возвращаем его на то же место. */
const STATE_KEY = "viola-kl-state";
const TTL_MID = 24 * 3600e3;   // недопройденный тест живёт сутки
/* Сутки, а не три часа: первое касание бота уходит через три часа и говорит
   «там осталось буквально три минуты». Если прогресс к этому моменту стёрт,
   человек начинает с нуля, и текст врёт. */
const TTL_DONE = 24 * 3600e3;  // готовый результат — сутки

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      t: Date.now(), stage: stage, idx: idx,
      answers: answers.slice(), forks: forks, startedAt: startedAt,
      res: lastResult
    }));
  } catch (e) {}
}

function clearState() {
  try { localStorage.removeItem(STATE_KEY); } catch (e) {}
}

/* Шкалы, без которых экран результата не построить: powers() читает их
   напрямую. Раньше запись без них роняла запуск. */
const SCALES_NEEDED = ["out", "inn", "gap"];

/* Сохранённое прохождение могло остаться от прежней версии теста: вопросы
   и способ хранения результата менялись, а запись живёт до суток. Такое
   состояние роняло boot(), и человек при каждом открытии видел экран
   «тест не открылся» — весь срок хранения. Не сошлось — молча начинаем
   заново: потерять полтора экрана ответов не так дорого, как сутки не мочь
   войти. Проходящему сейчас это ничем не грозит — его запись форме отвечает. */
function stateOk_(s) {
  const a = s.answers;
  if (!Array.isArray(a) || a.length > Q.length) return false;
  if (!a.every(v => typeof v === "number" && v >= 0 && v <= 3)) return false;
  if (s.res) {
    if (!Array.isArray(s.res.wheel) || s.res.wheel.length !== SPHERES.length) return false;
    if (!SCALES_NEEDED.every(k => typeof s.res[k] === "number")) return false;
  }
  return true;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!s || !s.t) return null;
    const done = (s.answers || []).length === Q.length;
    if (Date.now() - s.t > (done ? TTL_DONE : TTL_MID)) { clearState(); return null; }
    if (!stateOk_(s)) { clearState(); return null; }
    return s;
  } catch (e) { return null; }
}

function pryamoyVhod() {
  const h = (location.hash || "").replace("#", "");
  let q = "";
  try { q = new URLSearchParams(location.search).get("p") || ""; } catch (e) {}
  /* Возвращаем не «да/нет», а какой продукт просили: их теперь два.
     «neudobnye» — витрина события, на неё смотрят кнопки в постах,
     эта ссылка живая. «ap» — витрина практикума, туда же ведёт сам тест. */
  var ключ = h || q;
  if (ключ === "neudobnye") return "sobytie";
  if (ключ === "ap" || ключ === "praktikum") return "ap";
  return "";
}

function boot() {
  /* Прямая ссылка сразу на оффер, минуя тест. Проверяем до восстановления
     состояния: человек пришёл за событием, а не дочитывать свой результат.
     Два способа: #neudobnye · ?p=neudobnye — событие,
     #ap · ?p=ap — практикум. */
  var прямо = pryamoyVhod();
  if (прямо === "sobytie") { offerSobytie(null); return; }
  if (прямо === "ap") { offer(null); return; }

  const s = loadState();
  if (!s) { intro(); return; }

  (s.answers || []).forEach(v => answers.push(v));
  Object.keys(s.forks || {}).forEach(k => { forks[k] = s.forks[k]; });
  startedAt = s.startedAt || 0;

  if (answers.length === Q.length) {
    if (s.stage === "fork" && (s.idx || 0) < FORKS.length) { idx = s.idx || 0; fork(); return; }
    /* Аргумент обязателен: без него result() отправит прохождение в таблицу второй раз.
       Берём сохранённый вердикт, если он есть, — тогда тип не переиграется. */
    result(s.res || score());
    return;
  }
  if (s.stage === "q" && answers.length) { idx = Math.min(s.idx || 0, Q.length - 1); question(); return; }

  answers.length = 0;
  intro();
}

/* Стартуем не сразу: страховка наверху дождётся Телеграма — или того, что его
   не будет, — и позовёт сама. Прямой вызов оставлен на случай, если верхний
   блок почему-то не отработал: без запуска тест не оставляем ни при каких условиях. */
function run() {
  try {
    boot();
  } catch (e) {
    if (window.__fallback) window.__fallback(e && e.message ? e.message : e);
  }
}

if (window.__appStart) window.__appStart(run); else run();
</script>
