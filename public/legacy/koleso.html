<script>
/* Страховка. Если основной скрипт не разберётся или упадёт на старом браузере,
   человек увидит текст и объяснение, а не белый экран — и мы узнаем об этом.
   Здесь намеренно только ES5: этот блок обязан работать даже там, где не работает остальное. */
(function () {
  var shown = false;
  function fallback(msg) {
    if (shown) return;
    shown = true;
    /* Причиной падения могло быть само сохранённое прохождение: формат менялся,
       а запись живёт в памяти браузера до суток. Пока её не убирали, человек
       получал этот экран при каждом открытии — сутки подряд, и «открыть заново»
       ему не помогало. Убираем сразу: перезагрузка после этого лечит. */
    try { localStorage.removeItem("viola-kl-state"); } catch (e) {}
    var box = document.getElementById("screen") || document.body;
    if (!box) return;
    box.innerHTML =
      '<div style="max-width:32rem;margin:1.5rem auto;padding:1.4rem;font:16px/1.55 system-ui,-apple-system,sans-serif;' +
      'color:#241D28;background:#fff;border:1px solid #E0D6DD;border-radius:4px">' +
      '<p style="margin:0 0 .9rem;font-size:1.2rem">Тест не открылся с первого раза</p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Так бывает: оборвалась связь или страница не догрузилась. ' +
      'Нажмите «Открыть заново» — обычно этого хватает.</p>' +
      '<p style="margin:0 0 .9rem"><button onclick="location.reload()" ' +
      'style="font:inherit;padding:.7rem 1.1rem;color:#fff;background:#A2703C;border:0;border-radius:4px">' +
      'Открыть заново</button></p>' +
      '<p style="margin:0 0 .9rem;color:#5C5162">Не помогло — откройте ту же ссылку в обычном браузере: ' +
      '<a href="' + location.origin + '/test/koleso" style="color:#A2703C">' + location.host + '/test/koleso</a></p>' +
      '<p style="margin:0;font-size:.8rem;color:#8B7F92">Если и там не открылось, пришлите нам эту строку: ' +
      String(msg).replace(/</g, "&lt;").slice(0, 200) + '</p></div>';
  }
  window.__fallback = fallback;
  window.addEventListener("error", function (e) {
    fallback(e && e.message ? e.message : "неизвестная ошибка");
  });
  /* Скрипт у нас встроенный, ему нечего ждать. Пусто через семь секунд — значит не доехал. */
  setTimeout(function () {
    var s = document.getElementById("screen");
    if (s && !s.firstChild) fallback("пустой экран");
  }, 7000);

  /* ——— когда стартовать ———
     Ждать больше нечего: Телеграма здесь нет, а скрипт теста встроен в саму
     страницу. Точку входа оставляем прежней — основной скрипт по-прежнему
     зовёт window.__appStart, и страховка выше по-прежнему ловит его падение. */
  window.__appStart = function (fn) { fn(); };
})();
</script>

  /* Палитра снята с сайта: тёплый крем, бронза, тёмно-коричневая кнопка-таблетка. */
  /* Светлая тема, версия 28.08. Виола попросила светлее, референс —
     Мел Робинс. Из её системы взята структура: почти белый фон, почти
     чёрный текст, крупный жирный гротеск в заголовках, много воздуха
     и один цвет-маркер на главной фразе.

     Жёлтый маркер оттуда НЕ берём сознательно. Жёлтый у Мел Робинс —
     личная подпись, привязанная к её лицу, очкам и книгам; часть нашей
     аудитории её знает, и копия читалась бы как копия. Маркер остаётся,
     но в тёплом золоте Виолы, поэтому тест и сайт флагмана не разъезжаются.
     Решение продюсера 28.08 из трёх показанных вариантов. */
  :root {
    --ground: #FBFAF7;
    --surface: #FFFFFF;
    --surface-2: #F5F1EA;
    --ink: #191512;
    --ink-soft: #4A423B;
    --ink-mute: #867C71;
    --line: #E8E2D8;
    --line-strong: #D3C9B9;
    /* Акцент — цвет текста, не коричневый. 28.08 продюсер: на светлом
       фоне коричневый выглядит грязно. У референса цветной ровно один
       элемент — маркер; всё остальное чёрное. Коричневый остался только
       в --mark и --accent-soft, то есть в заливках, а не в буквах. */
    --accent: #191512;
    --accent-soft: #F6E3BE;
    /* Цвет маркера. Отдельной переменной, потому что в тёмной теме
       он не осветляется, а меняется целиком. */
    --mark: #F6D98C;
    --mark-ink: #191512;
    --warn: #A33B26;
    --deep: #191512;
    --shadow: 0 1px 2px rgba(40, 32, 26, .05), 0 18px 40px -24px rgba(40, 32, 26, .28);
    /* Кнопка плоская и почти чёрная. Градиент и коричневый цвет делали
       её мягкой; у референса кнопка — плотный прямоугольник цвета текста,
       и именно это читается как «нажми», а не «посмотри». */
    --btn-bg: #191512;
    --btn-ink: #FFFFFF;
    --btn-shadow: 0 8px 20px -12px rgba(25, 21, 18, .45);
    /* Три уровня карты. Без них человек видит полосы, но не понимает,
       где норма: полоса на 47% — это хорошо или плохо? Цвет отвечает сразу. */
    --band-low: #A33B26;
    --band-mid: #C29A6C;
    --band-hi:  #191512;
  }

  /* Автопереключения на тёмную тему здесь нет, и это решение, а не пропуск.
     28.08 Виола попросила светлый дизайн, продюсер выбрал светлую палитру
     как стандарт. Пока стоял @media (prefers-color-scheme: dark), человек
     с тёмным режимом в системе видел тёмную страницу и справедливо считал,
     что дизайн не поменялся.

     Тёмная палитра ниже не выброшена: она включается вручную атрибутом
     data-theme="dark" на <html>. Вернуть автоматику — снова обернуть её
     в @media, одна строка. */

  :root[data-theme="dark"] {
      --ground: #241C18;
    --surface: #2B211C;
    --surface-2: #352822;
    --ink: #F6F0E8;
    --ink-soft: #D8C9BA;
    --ink-mute: #A29385;
    --line: #3E312A;
    --line-strong: #55443A;
    --accent: #C9A87F;
    --accent-soft: #3A2C22;
    /* В тёмной теме маркер не осветляется, а становится плотной
       золотой плашкой с тёмным текстом: светлый текст на светлом
       золоте не читается вовсе. */
    --mark: #E4C489;
    --mark-ink: #241C18;
    --warn: #E08A72;
    --deep: #F6F0E8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 40px -20px rgba(0, 0, 0, .6);
    --btn-bg: #F0E6D8;
    --btn-ink: #191512;
    --btn-shadow: 0 8px 20px -12px rgba(0, 0, 0, .7);
    --band-low: #E08A72;
    --band-mid: #8A7358;
    --band-hi:  #D8B991;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Golos Text', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: 1.25rem 1.15rem calc(3rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    min-height: 100vh;
  }

  /* — шкала приёмника — */
  .top { display: flex; flex-direction: column; gap: .75rem; }

  .brand {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mute);
  }

  .dial { display: flex; gap: 3px; height: 22px; align-items: flex-end; }

  .tick {
    flex: 1;
    height: 7px;
    border-radius: 1px;
    background: var(--line);
    transition: height .25s ease, background-color .25s ease;
  }
  .tick.done { background: var(--line-strong); }
  .tick.now { height: 22px; background: var(--accent); }

  /* — карточка — */
  /* Карточка перестала быть карточкой 28.08. Рамка, тень и скруглённый
     угол делали из экрана окошко: контент сидел внутри коробки, а вокруг
     оставалось поле. У референса контент лежит прямо на странице, как
     слайд карусели, и работает не рамка, а воздух между блоками.
     Поэтому фона, рамки и тени здесь больше нет, а зазор вырос. */
  .card {
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: .4rem 0 0;
    box-shadow: none;
    display: flex; flex-direction: column; gap: 2rem;
  }

  .step {
    font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-mute); font-variant-numeric: tabular-nums;
  }

  /* Заголовки — жирный гротеск с отрицательным трекингом. Прежняя Prata
     читалась тяжело на маленьком кегле, а вопросов в тесте двадцать
     четыре подряд, и каждый надо прочитать внимательно. */
  h1 {
    font-weight: 700;
    letter-spacing: -.035em;
    text-wrap: balance;
    margin: 0;
    font-size: 2.7rem; line-height: 1.03;
  }
  h2 {
    font-weight: 700;
    letter-spacing: -.025em;
    text-wrap: balance;
    margin: 0;
    font-size: 1.75rem; line-height: 1.18;
  }
  /* Вопросы длинные, потому что понятные. На маленьком экране
     длинный вопрос набирается мельче, чтобы ответы остались видны. */
  h2.long { font-size: 1.45rem; }

  /* Надзаголовок и заголовок держим одним блоком, чтобы между ними не влезал общий отступ карточки */
  .title-block { display: flex; flex-direction: column; gap: .5rem; }
  .title-block .step { color: var(--ink-soft); }
  /* «Предзапись» — плашкой: это главное слово экрана, а не часть подписи.
     Цвет текста берём от фона карточки, поэтому контраст держится в обеих темах. */
  .step .tag {
    display: inline-block;
    background: var(--accent);
    color: var(--surface);
    padding: .3em .8em;
    border-radius: 999px;
    font-weight: 700;
  }
  /* Плашка стоит своей строкой, поэтому между ней и подписью отбивка меньше общей. */
  .title-block .step + .step { margin-top: -.15rem; }

  /* Название программы на экране предзаписи — главный акцент страницы */
  /* Название события — самое крупное на экране. До 28.08 оно было
     2,4rem и уступало заголовку результата, хотя это витрина продукта
     и первое, что человек видит после колеса. */
  h2.offer-title {
    font-weight: 700;
    font-size: 3.2rem; line-height: .95;
    letter-spacing: -.035em;
    color: var(--ink);
  }
  /* «НЕУДОБНЫЕ» — одно длинное слово, переносить его негде. На 320
     пикселях при 3,2rem оно вылезает за карточку и даёт горизонтальную
     прокрутку всей странице. Медиазапрос, а не clamp: clamp старые
     вебвью Андроида не понимают. */
  @media (max-width: 360px) {
    h2.offer-title { font-size: 2.6rem; }
  }
  /* Надзаголовок над названием: крупнее и темнее обычного .step.
     Он говорит, что это за формат и для кого, и терялся в цвете подписи. */
  .title-block .step.loud {
    font-size: .84rem; letter-spacing: .18em; font-weight: 600;
    color: var(--ink);
  }

  p { margin: 0; }
  .lede { color: var(--ink-soft); }
  /* Обещание под названием события. Крупнее обычного абзаца и в основном
     цвете: это единственная строка, ради которой человек читает экран
     дальше. Ниже неё всё уже подробности. */
  .promise-lead {
    font-size: 1.14rem; line-height: 1.45; color: var(--ink);
    margin: 0; padding-left: .85rem; border-left: 3px solid var(--accent);
  }
  .quiet { color: var(--ink-mute); font-size: .88rem; line-height: 1.5; }

  .voice {
    border-left: 2px solid var(--accent);
    padding-left: .9rem;
    font-family: Georgia, "Iowan Old Style", serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  /* Зазор между ответами вырос вместе с рамкой: плотная рамка на .55rem
     склеивала кнопки в решётку, и глаз читал их как таблицу, а не как
     четыре отдельных выбора. */
  .answers { display: flex; flex-direction: column; gap: .75rem; }

  button.ans {
    appearance: none;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 1.05rem 1.15rem;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .08s ease;
  }
  /* Наведение и выбор меняют не рамку, а заливку: рамка уже плотная,
     и её потемнение на глаз не читается. */
  button.ans:hover { background: var(--ink); color: var(--surface); }
  button.ans:active { transform: scale(.99); }

  button.go {
    appearance: none;
    font: inherit;
    font-weight: 600;
    color: var(--btn-ink);
    background: var(--btn-bg);
    border: 0;
    border-radius: 999px;
    box-shadow: var(--btn-shadow);
    padding: .95rem 1.4rem;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  button.go:hover { opacity: .88; }

  button.go.big {
    font-size: 1.06rem;
    padding: 1.1rem 1.4rem;
    transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  button.go.big:hover {
    opacity: 1;
    filter: brightness(1.06);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -10px var(--accent);
  }
  button.go.big:active { transform: translateY(0); }
  button.go.big span { margin-left: .2rem; }

  a.go { display: block; text-align: center; text-decoration: none; }
  a.go.big { color: #FFF; }

  button.go:disabled, button.go.big:disabled { opacity: .55; cursor: default; }

  /* Два способа оплаты. Карточки намеренно одинаковые до пикселя: рамка,
     фон, размер суммы, кнопка. Аудитория делится примерно пополам, и любой
     намёк «этот способ основной» половине людей сообщает, что они здесь
     второй сорт. */
  .ways { display: flex; flex-direction: column; gap: .8rem; margin: .2rem 0 .4rem; }
  .way {
    display: flex; flex-direction: column; gap: .35rem;
    padding: 1.1rem 1.1rem 1.2rem;
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    background: var(--surface-2);
  }
  .way-sum {
    font-weight: 700; font-size: 1.75rem; line-height: 1.1;
    letter-spacing: -.02em; color: var(--ink);
  }
  .way-what { font-weight: 600; }
  /* Две строки минимум: у одного способа пояснение длиннее, и без этого
     карточки разной высоты. Аудитория делится пополам, поэтому равенство
     половин здесь не косметика. */
  .way-note {
    margin: 0 0 .35rem; font-size: .92rem; color: var(--ink-soft);
    line-height: 1.45; min-height: 2.9em;
  }
  /* margin-top: auto прижимает кнопки к низу карточки. Пояснения разной
     длины, и без этого кнопки вставали на разной высоте — глаз читает это
     как «одна главнее». */
  .way button.go.big { width: 100%; font-size: 1rem; padding: .95rem 1.2rem; margin-top: auto; }

  /* На широком экране способы встают рядом: так равенство читается сразу,
     без прокрутки от одного к другому. */
  @media (min-width: 560px) {
    .ways { flex-direction: row; }
    .way { flex: 1 1 0; }
  }

  .fields { display: flex; flex-direction: column; gap: .8rem; }
  .fields label {
    display: flex; flex-direction: column; gap: .35rem;
    font-size: .74rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .fields input {
    font: inherit; font-size: 1.02rem; color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: .8rem .9rem;
    text-transform: none; letter-spacing: normal;
  }
  .fields input:focus { border-color: var(--accent); outline: none; }

  .ask {
    display: flex; flex-direction: column; gap: .5rem;
    border: 1px solid transparent; border-radius: 3px;
    margin: 0 -.7rem; padding: .7rem;
    transition: border-color .2s ease, background-color .2s ease;
  }
  /* Пока на вопрос не ответили, а записаться уже нажали — обводим сам вопрос.
     Подсказки под кнопкой человек не видит: она ниже сгиба и набрана мелким. */
  .ask.need {
    border-color: var(--warn);
    background: rgba(176, 58, 38, .07);   /* без color-mix: его нет на старых Android */
  }
  .ask-need-note { color: var(--warn); font-size: .88rem; font-weight: 600; line-height: 1.4; }
  .ask-q { font-size: 1rem; line-height: 1.4; }
  .ask-note { font-size: .86rem; color: var(--ink-mute); line-height: 1.45; }
  .chips { display: flex; gap: .5rem; margin-top: .2rem; }
  /* Три варианта по-русски в строку не помещаются — столбиком и по левому краю. */
  .chips-col { flex-direction: column; }
  .chips-col .chip { text-align: left; }
  .chip {
    flex: 1; appearance: none; font: inherit; font-size: .95rem;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 3px;
    padding: .7rem .6rem; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }

  .promise {
    background: var(--accent-soft);
    border-radius: 3px;
    padding: .9rem 1rem;
    font-size: .95rem;
    line-height: 1.45;
  }

  /* Окно раннего входа. Стоит прямо над ценой: сначала человек понимает,
     почему он здесь и почему сейчас, потом видит сумму. */
  .window {
    border: 1px solid var(--accent-soft); border-radius: 14px;
    background: var(--surface-2); padding: 1rem 1.1rem 1.05rem;
    display: flex; flex-direction: column; gap: .5rem;
  }
  /* Часть про срок отделена от части про места: срок исчезает после эфира,
     места живут до закрытия продаж. Свой flex нужен, потому что зазор
     у родителя на обёртку не распространяется. */
  .till { display: flex; flex-direction: column; gap: .5rem; }
  .window-h { font-weight: 600; font-size: 1.06rem; color: var(--accent); line-height: 1.3; }
  .window p { margin: 0; font-size: .95rem; line-height: 1.5; color: var(--ink-soft); }
  .window-left {
    font-weight: 600; font-size: .95rem; text-align: center;
    padding-top: .7rem; border-top: 1px solid var(--line);
    color: var(--ink-soft);
  }
  /* Обратный отсчёт отдельным блоком по центру. Клетки одной ширины,
     цифры моноширинными: иначе на каждой смене секунды строка дёргалась бы,
     подстраиваясь под ширину «1» и «8». */
  .clock { display: flex; justify-content: center; gap: .45rem; }
  .cl {
    display: flex; flex-direction: column; align-items: center;
    min-width: 3.6rem; padding: .5rem .3rem .45rem;
    border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong);
  }
  .cl b {
    font-weight: 700;
    font-size: 1.6rem; line-height: 1.1; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .cl i {
    font-style: normal; font-size: .68rem; line-height: 1.2;
    color: var(--ink-mute); margin-top: .15rem; text-align: center;
  }
  /* Счётчик мест. Отделён линией сверху и стоит по центру: это второе
     число блока после таймера, и мельче подписи оно тонуло. */
  .seats { display: none; }
  .seats.on {
    display: block; text-align: center;
    padding-top: .75rem; border-top: 1px solid var(--line);
  }
  .seats-n {
    display: block; font-weight: 700; font-size: 1.85rem;
    line-height: 1.1; letter-spacing: -.02em;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .seats-cap { display: block; font-size: .82rem; color: var(--ink-mute); margin-top: .2rem; }
  .seats-bar {
    display: block; height: 10px; margin: .55rem 0 .4rem;
    border-radius: 999px; background: var(--line); overflow: hidden;
  }
  .seats-bar span {
    display: block; height: 100%; background: var(--accent); border-radius: 999px;
    /* Полоса доезжает до своей длины за полсекунды. На глаз это читается
       как «прямо сейчас заняли ещё», а прыжок читался бы как перерисовка. */
    transition: width .5s ease-out;
  }
  .seats-left { display: block; font-size: .95rem; font-weight: 600; color: var(--ink); }

  /* Полоса статуса на форме и на оплате. Держится над содержимым карточки
     и отделена от него линией: это фон сделки, а не часть разговора.
     Две строки, а не одна: на 320 пикселях подпись и цифра в один ряд
     не помещаются, а перенос посреди цифры выглядит как поломка. */
  .strip {
    display: flex; flex-direction: column; gap: .18rem;
    padding: .6rem .8rem .55rem; margin-bottom: .2rem;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
  }
  .strip-row { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .strip-k { font-size: .8rem; color: var(--ink-mute); }
  .strip-v {
    font-size: .98rem; font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .strip-bar {
    display: block; height: 5px; margin-top: .45rem;
    border-radius: 999px; background: var(--line); overflow: hidden;
  }
  .strip-bar span {
    display: block; height: 100%; background: var(--accent);
    border-radius: 999px; transition: width .5s ease-out;
  }

  /* Цена над кнопкой. Крупная рублёвая, под ней мельче валютная: обе видны
     сразу, но глаз не мечется между двумя одинаковыми цифрами. */
  .price-block {
    display: flex; flex-direction: column; gap: .25rem; align-items: center;
    text-align: center; margin: .4rem 0;
    padding: 1.1rem 1rem 1rem;
    border-radius: 16px; background: var(--surface-2);
    border: 1px solid var(--line-strong);
  }
  /* Старая цена над новой: мельче, приглушённо и зачёркнута. Крупной
     её делать нельзя — глаз должен уйти на ту цифру, которую платят. */
  .price-old {
    font-size: 1.35rem; line-height: 1; color: var(--ink-mute);
    text-decoration: line-through; text-decoration-thickness: 2px;
  }
  .price-main {
    font-weight: 700; font-size: 3rem; line-height: 1;
    letter-spacing: -.03em; color: var(--ink);
  }
  .price-alt { font-size: 1rem; color: var(--ink); }
  .price-note { margin: .35rem 0 0; font-size: .88rem; color: var(--ink-mute); line-height: 1.45; }

  .cta-note {
    font-size: .82rem; color: var(--ink-mute); text-align: center;
    margin-top: -.15rem;
  }

  /* Карта по сферам. Полоса — доля взрослой стороны; чем длиннее, тем больше
     решаете вы. Отдельного «процента детскости» нигде нет: это был бы приговор. */
  .map { display: flex; flex-direction: column; gap: .55rem; }
  .map-h {
    font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: .15rem;
  }
  .map-row {
    display: grid; grid-template-columns: 7.4rem 1fr; gap: .2rem .7rem;
    align-items: center;
  }
  .map-name { font-size: .95rem; color: var(--ink); line-height: 1.25; }
  .map-bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .map-bar span { display: block; height: 100%; border-radius: 999px; background: var(--band-mid); }
  /* Метка стоит своей строкой под полосой, а не третьей колонкой: «решают за вас»
     в 2,6 rem не помещается, а сокращать её до процента мы как раз не хотим. */
  .map-val { grid-column: 2; font-size: .82rem; color: var(--ink-mute); margin-top: -.1rem; }
  .map-row.b-lo  .map-bar span { background: var(--band-low); }
  .map-row.b-lo  .map-val { color: var(--band-low); font-weight: 600; }
  .map-row.b-hi  .map-bar span { background: var(--band-hi); }
  .map-row.b-hi  .map-val { color: var(--band-hi); font-weight: 600; }
  /* Худшую сферу дополнительно держим жирным именем: цвет цветом, но на карте
     из четырёх строк глазу нужна одна точка входа. */
  .map-row.is-low .map-name { font-weight: 700; }

  /* Находка — то, ради чего человек проходил тест. Стоит выше текста
     намеренно: сначала картинка, потом объяснение. */
  .find {
    display: flex; flex-direction: column; gap: .7rem;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .find-val.b-lo  { color: var(--band-low); }
  .find-val.b-mid { color: var(--ink); }
  .find-val.b-hi  { color: var(--band-hi); }
  .find .find-flat { color: var(--ink); }
  .find-flat { font-size: .95rem; line-height: 1.5; color: var(--ink-soft); }
  .map-note { font-size: .82rem; color: var(--ink-mute); line-height: 1.45; margin-top: .2rem; }

  /* Акцепт под кнопкой. Мельче подписи: это правовая сноска, а не аргумент. */
  .cta-legal {
    font-size: .74rem; line-height: 1.45; color: var(--ink-mute); text-align: center;
    margin-top: -.5rem;
  }
  /* Общее правило для ссылок. Без него всё, что не попало в .cb и
     .cta-legal (политика на первом экране, отдел заботы в лид-форме),
     красилось браузерным синим и в тёмной теме почти не читалось. */
  a { color: var(--accent); }
  .cta-legal a { color: var(--ink-mute); }

  /* ——— колесо ——— */
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: .6rem; }
  .wheel { width: 100%; max-width: 22rem; height: auto; display: block; }
  .wheel .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .wheel .ax { stroke: var(--line); stroke-width: 1; }
  .wheel .axt { font-size: 10px; fill: var(--ink-mute); letter-spacing: .04em; }
  /* Единственный контур. Плотнее прежнего: раньше он лежал поверх второго
     и просвечивал, теперь стоит один на пустом кольце. */
  /* Фигура заливается золотом, а обводится цветом текста: коричневая
     заливка на светлом фоне выглядела как пятно. */
  .wheel .inn { fill: var(--mark); fill-opacity: .55; stroke: var(--ink); stroke-width: 2; }

  .score { font-size: 1.1rem; line-height: 1.45; text-align: center; }

  .unpack { display: flex; flex-direction: column; gap: 1rem; }
  .how { margin: .5rem 0 0; font-size: .92rem; color: var(--ink-soft); line-height: 1.5; }
  .read { display: flex; flex-direction: column; gap: 1rem; }
  .read-row { display: flex; flex-direction: column; gap: .1rem; }
  .read-head { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .read b { font-weight: 600; font-size: 1.18rem; color: var(--accent); }
  /* Оценка словом, а не цветом в одиночку: на чёрно-белом экране и при
     дальтонизме строка всё равно читается. */
  .read-lvl {
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    padding: .12rem .5rem; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line-strong); color: var(--ink-soft);
  }
  .read-lvl.bad  { border-color: var(--band-low); color: var(--band-low); }
  .read-lvl.good { border-color: var(--band-hi);  color: var(--band-hi); }
  .read-what { font-size: .82rem; color: var(--ink-mute); }
  .read-txt { margin-top: .25rem; line-height: 1.5; }
  /* Заголовки разделов результата. Раньше это была мелкая серая строка
     капсом, и человек её просто не видел: разделы сливались в один поток.
     Теперь это настоящий заголовок, тем же шрифтом, что и остальные. */
  .unpack-h {
    font-weight: 600;
    font-size: 1.45rem; line-height: 1.25; color: var(--ink);
    letter-spacing: 0; text-transform: none;
    padding-top: .8rem; border-top: 1px solid var(--line-strong);
  }
  .un-block { display: flex; flex-direction: column; gap: .4rem; }
  .un-name {
    font-weight: 600; font-size: 1.18rem; color: var(--accent);
  }
  .un-block ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .5rem; }
  .un-block li { position: relative; padding-left: 1.1rem; line-height: 1.5; }
  .un-block li::before {
    content: ""; position: absolute; left: 0; top: .62em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  /* Цена сферы. Узнавание без названной цены остаётся наблюдением,
     а нам нужно, чтобы человек увидел, во что ему это обходится. */
  .un-cost {
    margin: .2rem 0 0; padding: .6rem .8rem; border-left: 2px solid var(--accent);
    background: var(--surface-2); line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    button.go.big { transition: none; }
    button.go.big:hover { transform: none; }
  }

  .ghost {
    appearance: none; font: inherit; font-size: .85rem;
    background: none; border: none; color: var(--ink-mute);
    cursor: pointer; padding: .4rem 0; text-align: left;
    align-self: flex-start;
  }
  .ghost:hover { color: var(--ink); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* — результат — */
  .verdict { display: flex; flex-direction: column; gap: .5rem; }
  .verdict .cap {
    font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  /* Заголовок результата — цвета текста, а не акцента. В светлой теме
     акцент остался на мелком: имена сфер, надзаголовки, маркер. Крупный
     коричневый заголовок спорил с ними за внимание и снижал контраст
     там, где он нужен больше всего. */
  .verdict h1 { color: var(--ink); font-size: 2.3rem; }

  .body-copy { display: flex; flex-direction: column; gap: .85rem; }

  .addendum {
    background: var(--surface-2);
    border-radius: 3px;
    padding: .9rem 1rem;
    font-size: .93rem;
    color: var(--ink-soft);
  }

  .foot { display: flex; flex-direction: column; gap: .6rem; }

  /* ⚠️ Имя .bridge занято этим блоком — бежевая плашка на экране
     результата. Связка на экране события называется .lead-in: 28.08
     она была названа .bridge, подхватила отсюда фон, шрифт и отступы
     и уехала в бежевую коробку. */
  /* ⚠️ Имя .bridge занято этим блоком — бежевой плашкой на экране
     результата. Связка на экране события называется .lead-in: сначала
     она была названа .bridge, подхватила отсюда фон, шрифт и отступы
     и уехала в бежевую коробку. */
  .bridge {
    background: var(--accent-soft);
    border-radius: 3px;
    padding: 1rem 1.05rem;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    line-height: 1.45;
  }

  /* Три дня. Раньше это был плотный список с точками, и три абзаца описания
     слипались в один блок: глаз не находил, где кончается один день
     и начинается другой. Теперь каждый день — своя карточка с воздухом
     внутри, как на сайте флагмана. */
  .inside { display: flex; flex-direction: column; gap: .9rem; }
  .inside-h {
    font-weight: 600; font-size: 1.45rem; line-height: 1.25; color: var(--ink);
    padding-top: .8rem; border-top: 1px solid var(--line-strong);
  }
  .inside ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .8rem; }
  /* Название дня — заголовок карточки: полужирный и крупнее описания.
     Раньше они были одного кегля и веса и читались одним куском. */
  .inside li {
    position: relative; overflow: hidden;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    padding: 1.15rem 1.15rem 1.25rem;
    color: var(--ink); font-weight: 400; font-size: 1rem; line-height: 1.4;
    box-shadow: 0 6px 18px -14px rgba(60, 48, 40, .5);
  }
  /* Номер дня водяным знаком в углу. Он не мешает тексту и сразу говорит:
     дней три, вот первый. Правый отступ карточки под него и оставлен. */
  .day-n {
    margin-left: auto;
    font-weight: 700; font-size: 2rem; line-height: 1;
    color: var(--ink); opacity: .14; pointer-events: none;
  }
  /* Длительность отдельной строкой: человек считает, сколько времени
     это займёт, раньше, чем читает, о чём это. */
  /* Название дня — самая крупная строка карточки. Человек листает и
     решает по нему, интересен ему этот день или нет. */
  .day-t { font-weight: 700; font-size: 1.14rem; line-height: 1.3; letter-spacing: -.015em; }
  .inside li .dur {
    display: block; margin-top: .3rem;
    color: var(--ink-mute); font-weight: 400; font-size: .85rem;
    letter-spacing: .01em;
  }
  /* Дата и название дня — заголовок карточки, а не бледная приписка.
     Раньше они красились в самый тусклый цвет и терялись. */
  /* Иконка и дата в одной строке: сначала глаз ловит формат дня, потом
     число. Строка отдельным блоком, поэтому плашка не разрывает название. */
  .day-head { display: flex; align-items: center; gap: .45rem; margin-bottom: .6rem; }
  /* Подложка кружка берётся из --surface, а не из --accent-soft: карточка
     стоит на --surface-2, и акцентная подложка сливалась с ней, особенно
     в тёмной теме, где иконка висела без кружка вовсе. */
  .day-ico {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 50%; background: var(--surface);
    border: 1px solid var(--line-strong); color: var(--accent);
  }
  /* Дата плашкой, а не строкой текста: человек листает и ищет глазами
     именно числа, чтобы понять, попадает он в эти дни или нет. */
  /* Только дата в шапке, а не любой <b> внутри карточки. Пока селектор
     был широким, выделенные слова в описании дня превращались в такие же
     бежевые пилюли и читались как ещё три даты. */
  .day-head b {
    display: inline-block; margin-bottom: 0;
    background: var(--accent-soft); color: var(--accent);
    padding: .25rem .65rem; border-radius: 999px;
    font-weight: 600; font-size: .88rem; letter-spacing: .01em; line-height: 1.3;
  }
  .inside .format { color: var(--ink-mute); font-size: .88rem; }
  /* Описание дня. Курсива нет: на трёх строках подряд он читается тяжело. */
  /* Описание дня. Три абзаца, а не сплошной кусок: на телефоне стена
     текста в карточке не читается, глазу нужны точки, где можно
     остановиться. Межстрочный расширен под мелкий экран. */
  .inside li .wq {
    display: block; margin-top: .75rem;
    color: var(--ink-soft); font-weight: 400; font-size: .98rem; line-height: 1.6;
  }
  .inside li .wq p { margin: 0; }
  .inside li .wq p + p { margin-top: .7rem; }
  /* Последний абзац — то, ради чего человек платит. Он темнее остальных,
     поэтому дочитывают именно до него. */
  .inside li .wq p:last-child { color: var(--ink); }
  /* Выделение внутри описания: плотнее и темнее, без плашки. */
  .inside li .wq b { font-weight: 600; color: var(--ink); }

  .gets { display: flex; flex-direction: column; gap: .8rem; }
  .gets-foot { margin: .7rem 0 0; font-size: .95rem; color: var(--ink-soft); }
  .gets-h {
    font-weight: 600; font-size: 1.45rem; line-height: 1.25; color: var(--ink);
    padding-top: .8rem; border-top: 1px solid var(--line-strong);
  }
  .gets ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  /* Волосяные линии между пунктами: список перестал быть кашей, каждый
     пункт читается отдельно. Цвет основной, а не приглушённый: это блок
     ценности, ради него человек и платит. */
  .gets li {
    position: relative; padding: .6rem 0 .6rem 1.2rem;
    border-bottom: 1px solid var(--line);
    color: var(--ink); font-size: 1rem; line-height: 1.5;
  }
  .gets li:last-child { border-bottom: 0; }
  .gets li::before { content: "—"; position: absolute; left: 0; top: .6rem; color: var(--accent); }
  /* Список с иконками: тире не нужно, его место занимает значок.
     Кружок тот же, что у дней, только меньше — пункт короче строки дня
     и большой кружок перевешивал бы текст. */
  .gets-ico li { padding-left: 2.5rem; }
  .gets-ico li::before { content: none; }
  .get-i {
    position: absolute; left: 0; top: .55rem;
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%; background: var(--surface);
    border: 1px solid var(--line-strong); color: var(--accent);
  }
  /* Подарки за ранний вход — тот же список, но выделен фоном и своей отметкой. */
  .gets.bonus {
    background: var(--surface-2);
    border: 1px solid var(--accent-soft);
    border-radius: 14px;
    padding: 1.1rem 1.15rem;
  }
  .gets.bonus .gets-h { border-top: 0; padding-top: 0; font-size: 1.15rem; }
  .gets.bonus li { border-bottom: 0; padding: .2rem 0 0 1.75rem; }
  .gets.bonus .gets-h { color: var(--accent); }
  /* Подарки метим эмодзи: на длинном экране взгляд цепляется за него раньше, чем за текст. */
  .gets.bonus li { color: var(--ink); padding-left: 1.75rem; }
  .gets.bonus li::before { content: "🎁"; font-size: 1rem; top: .05em; }
  .gets.bonus li b { font-weight: 600; }

  .med { color: var(--ink-mute); font-size: .82rem; line-height: 1.45; }
  .consents { display: flex; flex-direction: column; gap: .65rem; }
  .cb {
    display: grid; grid-template-columns: 20px 1fr; gap: .55rem; align-items: start;
    font-size: .88rem; line-height: 1.45; color: var(--ink-soft); cursor: pointer;
  }
  .cb input { width: 18px; height: 18px; margin: .1rem 0 0; accent-color: var(--accent); }
  .cb a { color: var(--accent); }
  .cb.err span { color: var(--warn); }
  .cb.err input { outline: 2px solid var(--warn); outline-offset: 2px; }

  .before-cta { display: flex; flex-direction: column; gap: .6rem; color: var(--ink); font-size: .97rem; line-height: 1.5; }
  .gets.bonus .bonus-note {
    margin-top: .3rem; padding-top: .7rem;
    border-top: 1px solid var(--line);
    color: var(--ink); font-size: .92rem; line-height: 1.45;
  }
  .cta-note.err { color: var(--warn); font-weight: 600; }
  .fields input.err { border-color: var(--warn); }

  /* Подсветка решающих мест. Одно средство на весь экран и не больше одного
     выделения на абзац — иначе подсветка перестаёт что-либо выделять.
     Внутри плашки .status не используем: акцент по accent-soft даёт слабый контраст,
     там роль подсветки играет <b>. */
  /* Маркер. Главный приём светлой темы: не цветной текст, а прочерченная
     по нему полоса, как маркером по бумаге. box-shadow вместо padding —
     чтобы плашка не разрывала межстрочный интервал и переносилась вместе
     со строкой, а не выталкивала соседние строки. */
  .hl {
    background: var(--mark); color: var(--mark-ink);
    box-shadow: 0 0 0 .18em var(--mark);
    border-radius: 2px; font-weight: 600;
  }

  /* Связка с колесом. Мелкая и приглушённая: она нужна, чтобы человек
     понял, откуда взялся этот экран, но спорить за внимание с обещанием
     не должна. */
  .lead-in { margin: 0; font-size: .95rem; line-height: 1.5; color: var(--ink-soft); }

  /* Подзаголовок обещания. Крупнее обычного абзаца, но легче обещания:
     обещание говорит «что будет», подзаголовок — «как это ощущается». */
  .promise-sub { margin: -.9rem 0 0; font-size: 1.02rem; line-height: 1.5; color: var(--ink-soft); }

  /* Тело оффера. Первый абзац крупнее прочих: это сцена узнавания, с неё
     человек решает, читать дальше или уйти. Последний — обещание, поэтому
     чернилами, а не приглушённым. Середина серая: там цена привычки,
     её читают по диагонали. */
  .offer-text { display: flex; flex-direction: column; gap: .7rem; margin: 0; }
  .offer-text p { margin: 0; font-size: 1.02rem; line-height: 1.5; color: var(--ink-soft); }
  .offer-text p:first-child { font-size: 1.14rem; line-height: 1.45; color: var(--ink); }
  .offer-text p:last-child { color: var(--ink); }
  /* Признание дара. Отбито линией сверху, потому что это смена темы:
     выше обещание, ниже комплимент. Без линии читалось как продолжение
     подзаголовка. */
  .ego {
    margin: 0; padding-top: .9rem; border-top: 1px solid var(--line);
    font-size: 1rem; line-height: 1.55; color: var(--ink-soft);
  }
  /* Стоит первым, поэтому линия уходит вниз: она отбивает комплимент
     от боли, которая идёт следом, а сверху отбивать нечего. */
  .ego-top {
    padding-top: 0; padding-bottom: .8rem;
    border-top: 0; border-bottom: 1px solid var(--line);
  }
  .ego b { color: var(--ink); font-weight: 600; }



  /* Даты события. Отбиты линиями сверху и снизу, а не выделены цветом:
     маркер на экране уже занят скидкой, а два маркера не выделяют ничего.
     Линия работает не хуже и не спорит с ним. */
  .dates {
    display: flex; flex-direction: column; gap: .25rem;
    padding: .85rem 0; margin: -.5rem 0 -.4rem;
    border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
  }
  .dates-n { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

  /* Подарок: скидка на флагман. Раньше это была строка прозой с маркером,
     и сумма тонула в предложении. Теперь набрано тем же приёмом, что даты:
     мелкая прописная надстрочка, крупное число, пояснение под ним. Число —
     единственное, что человек должен унести с этого блока.

     Заливка --accent-soft, а не --mark: маркер на странице один и стоит
     на заголовке, второй такой же спорил бы с ним за внимание.
     Текст только --ink и --ink-soft: --ink-mute на этой заливке даёт 3.24,
     ниже порога. Посчитано, не на глаз. */
  /* Блок про часы и формат. Заливка --surface-2, а не --accent-soft:
     акцентная подложка на странице одна и занята подарком, две подряд
     спорили бы за внимание. Отличается акцентной полосой слева, тем же
     приёмом, что карточки дней. */
  .live-note {
    display: flex; flex-direction: column; gap: .35rem;
    padding: 1rem 1.15rem; margin: .1rem 0;
    border-radius: 16px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--accent);
  }
  .live-h {
    font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600;
  }
  .live-n {
    font-size: 1.35rem; font-weight: 700; line-height: 1.15;
    letter-spacing: -.02em; color: var(--ink);
  }
  .live-t { font-size: .97rem; line-height: 1.55; color: var(--ink-soft); }
  .live-t b { color: var(--ink); font-weight: 600; }

  .gift {
    display: flex; flex-direction: column; gap: .3rem;
    padding: 1rem 1.15rem; margin: .1rem 0;
    border-radius: 16px;
    background: var(--accent-soft);
    border: 1px solid var(--line-strong);
  }
  .gift-h {
    font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600;
  }
  .gift-n {
    font-size: 2.1rem; font-weight: 700; line-height: 1;
    letter-spacing: -.03em; color: var(--ink);
  }
  .gift-t { font-size: 1rem; line-height: 1.4; color: var(--ink); }
  .gift-w { font-size: .85rem; color: var(--ink-soft); }
  .dates-k {
    font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* Маркер по заголовку — главный приём референса и то, из-за чего экран
     читается как «другой дизайн», а не как «те же буквы другого цвета».
     Полоса ложится за каждой строкой отдельно, потому что span строчный:
     фон строчного элемента рисуется по фрагментам строк, а не общим
     прямоугольником. Отступ даём тенью, а не padding: padding раздвинул
     бы строки и разорвал заголовок. */
  .mark {
    background: var(--mark); color: var(--mark-ink);
    box-shadow: .22em 0 0 var(--mark), -.22em 0 0 var(--mark);
    box-decoration-break: clone; -webkit-box-decoration-break: clone;

/* Сферы, где просело, от самой пустой. Нужны в двух местах: на результате
   их разбирают подробно, на экране события с них начинается разговор.
   Считаются в одном месте, чтобы два экрана не разошлись. */
function sagging(r) {
  const list = r.wheel.slice()
    .sort((a, b) => (a.inn - b.inn) || (b.gap - a.gap))
    .filter(c => readLevel(c) !== "good");

  /* Человек сам ответил, где ему сейчас тяжелее всего. Если эта сфера
     действительно просела, разбираем её первой. Раньше её ответ уходил
     только в таблицу, и получалось, что он написал «тело», а мы разбираем
     партнёра: при равных нулях порядок решала арифметика. */
  const назвал = forks && forks.bol;
  if (назвал) {
    const i = list.findIndex(c => c.k === назвал);
    if (i > 0) list.unshift(list.splice(i, 1)[0]);
  }
  return list;
}

/* Уровень сферы. Считается ровно по тому же числу, которым рисуется луч
   на колесе: сколько в этой сфере остаётся вам. Иначе фигура и подпись
   спорили бы — луч длинный, а рядом написано «проседает». */
function readLevel(c) {
  if (c.inn <= 3) return "bad";
  if (c.inn <= 6) return "mid";
  return "good";
}

/* Окно раннего входа. Дедлайн настоящий: в субботу эфир, после него
   событие открывается всем и цена растёт. Причина названа прямо, поэтому
   таймер здесь честный, а не давилка.

   Когда эфир прошёл, окно само закрывается и блок исчезает: таймер,
   который тикает после срока, или срок, который каждый раз отодвигают,
   кодекс честности запрещает отдельным пунктом. */
function windowLeft() {
  /* Считаем до priceUpAt — момента повышения цены. openAllAt оставлен
     запасным вариантом и держит кривую счётчика мест: если считать по
     нему, сдвиг срока сдвинет и число занятых. */
  const цель = CONFIG.priceUpAt || CONFIG.openAllAt;
  if (!цель) return null;
  const до = Date.parse(цель);
  if (!до) return null;
  const мс = до - Date.now();
  return мс > 0 ? мс : null;
}

/* Склонение подписи под числом: 1 день, 2 дня, 5 дней. */
function форма_(n, одна, две, много) {
  const с = n % 100, е = n % 10;
  if (с > 10 && с < 20) return много;
  if (е === 1) return одна;
  if (е > 1 && е < 5) return две;
  return много;
}

/* Четыре клетки обратного отсчёта. Секунды идут живыми: неподвижный
   таймер человек читает как картинку, а движущийся как факт. */
function clockCells(мс) {
  const всего = Math.max(0, Math.floor(мс / 1000));
  const д = Math.floor(всего / 86400);
  const ч = Math.floor((всего % 86400) / 3600);
  const м = Math.floor((всего % 3600) / 60);
  const с = всего % 60;
  const дв = n => (n < 10 ? "0" : "") + n;
  const cell = (v, п) => '<span class="cl"><b>' + v + '</b><i>' + п + '</i></span>';
  return cell(д, форма_(д, "день", "дня", "дней")) +
         cell(дв(ч), форма_(ч, "час", "часа", "часов")) +
         cell(дв(м), форма_(м, "минута", "минуты", "минут")) +
         cell(дв(с), форма_(с, "секунда", "секунды", "секунд"));
}

/* Тикаем раз в секунду. Останавливаемся сами, когда узел ушёл с экрана:
   человек листает между экранами, и брошенный интервал иначе продолжал бы
   писать в оторванный от страницы блок до конца сессии. */
function runClock(node) {
  const box = node.querySelector("#clock");
  if (!box) return;
  const tick = () => {
    if (!document.body.contains(box)) { clearInterval(id); return; }
    const мс = windowLeft();
    /* Срок вышел прямо у человека на глазах: убираем всё про эфир и
       оставляем блок мест, он живёт до закрытия продаж. */
    if (!мс) {
      clearInterval(id);
      const till = node.querySelector("#till");
      const after = node.querySelector("#after");
      if (till) till.style.display = "none";
      if (after) after.style.display = "";
      return;
    }
    box.innerHTML = clockCells(мс);
    /* Счётчик мест обновляем тем же тактом: он растёт по часам, и если
       число перевалит за целое, пока человек читает, он это увидит. */
    drawSeats(node);
  };
  const id = setInterval(tick, 1000);
  tick();
}

/* Сколько мест занято.

   Не спрашивается у таблицы и больше не считается от часов: число стоит
   рукой в CONFIG.seatsTaken, см. объяснение там. Решение продюсера 07.09.

   Единственное настоящее слагаемое — заявка самого этого человека. */
function seatsTaken_() {
  let n = CONFIG.seatsTaken;
  if (typeof n !== "number" || !isFinite(n)) return 0;
  n += сессияМест;
  /* Свою заявку человек помнит, и не увидеть её в счётчике — странно. */
  try { if (localStorage.getItem("viola-kl-zayavka")) n += 1; } catch (e) {}
  return Math.min(n, CONFIG.seats);
}

/* Прибавка внутри одного визита. Только растёт и заводится один раз
   за жизнь страницы: человек уходит на форму и возвращается, и увидеть
   число меньше прежнего он не должен — это читается как поломка. */
let сессияМест = 0;
let подъёмПошёл = false;
function runSeatsBump() {
  if (подъёмПошёл || !CONFIG.seatsBump) return;
  подъёмПошёл = true;
  CONFIG.seatsBump.forEach(сек => setTimeout(() => {
    сессияМест++;
    drawSeats(document);
  }, сек * 1000));
}

function drawSeats(node) {
  const box = node.querySelector("#seats");
  if (!box || !CONFIG.seats) return;
  const занято = seatsTaken_();
  const всего = CONFIG.seats;
  const осталось = Math.max(0, всего - занято);

  /* Разметку собираем один раз, дальше меняем только цифры. Иначе полоса
     на каждом такте рождалась бы заново и её плавный доезд не работал бы. */
  if (!box.getAttribute("data-built")) {
    box.setAttribute("data-built", "1");
    box.innerHTML =
      '<span class="seats-n" id="seats-n"></span>' +
      /* Подпись читается вместе с числом: «55 из 100 мест уже занято».
         Склонение идёт по сотне, поэтому оно не меняется и слово стоит
         жёстко — иначе на каждом шаге пришлось бы пересчитывать. */
      '<span class="seats-cap">мест уже занято</span>' +
      '<span class="seats-bar"><span id="seats-fill"></span></span>' +
      '<span class="seats-left" id="seats-left"></span>';
    box.className = "seats on";
  }
  const n = box.querySelector("#seats-n");
  const fill = box.querySelector("#seats-fill");
  const left = box.querySelector("#seats-left");
  if (n) n.innerHTML = занято + " из " + всего;
  if (fill) fill.style.width = Math.round(занято / всего * 100) + "%";
  if (left) left.innerHTML = осталось <= 20 ? "Свободных осталось " + осталось : "";
}

/* ——— узкая полоса статуса для формы и оплаты ———

   На экране события стоит большой блок: заголовок, объяснение причины,
   четыре клетки таймера, крупное число мест. Повторять его ещё дважды
   нельзя. Аудитория теста — эмпаты, люди с высокой чувствительностью
   к давлению; для них третий одинаковый экран с дедлайном читается не
   как срочность, а как то, что их продавливают, и они уходят.

   Поэтому дальше идёт одна строка в две линии над всем остальным:
   слева подпись, справа цифра, снизу тонкая полоса заполнения.
   Цифры те же самые — обе берутся из тех же функций, что и большой блок,
   и прибавка внутри визита у них общая. Разойтись они не могут.

   Причину («до поднятия цен») здесь не повторяем: человек прочитал её
   экраном раньше, и второй раз это уже не объяснение, а нажим. */
function stripHtml() {
  return '<div class="strip" id="strip">' +
    '<div class="strip-row"><span class="strip-k">До поднятия цен</span>' +
    '<span class="strip-v" id="strip-t">—</span></div>' +
    '<div class="strip-row"><span class="strip-k">Мест занято</span>' +
    '<span class="strip-v" id="strip-s">—</span></div>' +
    '<span class="strip-bar"><span id="strip-fill"></span></span>' +
    '</div>';
}

/* Одно и то же значение на всех экранах обеспечивается не копированием,
   а тем, что источник один. Здесь только отрисовка. */
function runStrip(node) {
  const box = node.querySelector("#strip");
  if (!box) return;
  const t = box.querySelector("#strip-t");
  const s = box.querySelector("#strip-s");
  const fill = box.querySelector("#strip-fill");
  const rowT = t && t.parentNode;
  const tick = () => {
    if (!document.body.contains(box)) { clearInterval(id); return; }
    const мс = windowLeft();
    /* Срок вышел — строка про него уходит, места остаются. */
    if (!мс) { if (rowT) rowT.style.display = "none"; }
    else if (t) {
      const всего = Math.floor(мс / 1000);
      const д = Math.floor(всего / 86400);
      const дв = n => (n < 10 ? "0" : "") + n;
      t.innerHTML = (д ? д + " " + форма_(д, "день", "дня", "дней") + " " : "") +
        дв(Math.floor((всего % 86400) / 3600)) + ":" +
        дв(Math.floor((всего % 3600) / 60)) + ":" + дв(всего % 60);
    }
    const занято = seatsTaken_();
    if (s) s.innerHTML = занято + " из " + CONFIG.seats;
    if (fill) fill.style.width = Math.round(занято / CONFIG.seats * 100) + "%";
  };
  const id = setInterval(tick, 1000);
  tick();
}

/* Первая строка на экране события. Она подхватывает то, что человек только
   что увидел, и называет его сферы по именам. Раньше здесь стояли два числа
   из прежней версии результата, которых на экране давно нет. */
function bridgeLine(r) {
  const sag = sagging(r);

  /* Ничего не просело. Продавать «вам плохо» тут нельзя, это было бы враньём.
     Но человек сам ответил, где ему сейчас тяжелее, и опереться на его
     собственные слова честно. Без этого ответа разговор просто не начинается,
     и такой человек уходит с результата ни с чем. */
  if (!sag.length) {
    const назвал = r.wheel.filter(c => c.k === (forks && forks.bol))[0];
    if (назвал)
      return "Колесо вы только что видели. Пустых мест у вас почти нет, и это бывает нечасто. И всё-таки вы написали, что тяжелее всего сейчас вот здесь: " + назвал.s + ". Начнём с этого.";
    return "Колесо вы только что видели. Пустых мест у вас почти нет, и это бывает нечасто. Дальше про то, как удержать это состояние и не скатиться обратно.";
  }

  const names = sag.slice(0, 2).map(c => c.s).join(" и ");

  /* Ветка «человек назвал сферу, а она у него зелёная» убрана 28.08 по
     решению продюсера: не усложнять переход индивидуальными оговорками,
     а бить сильным оффером под всю ЦА. Здесь мост делает одно — называет
     просевшие сферы по именам и передаёт слово офферу.

     История для тех, кто захочет вернуть: сначала мы про ответ человека
     молчали, потом сказали «там у вас как раз хватает» — и это было хуже
     всего: человек пришёл со своей болью, а перед кнопкой ему объясняли,
     что боли нет. */

  /* Когда просели все шесть, говорить «где-то у вас в порядке» — врать
     человеку в глаза на экране, где он только что увидел обратное. */
  if (sag.length === r.wheel.length)
    return "Колесо вы только что видели. Пусто у вас во всех шести сферах, тяжелее всего здесь: " + names + ". Дальше про то, что с этим делать.";

  /* Больше половины — это уже не «где-то», это система. Ровно половина
     сюда не попадает: три из шести честнее назвать «где-то, а где-то». */
  if (sag.length > r.wheel.length / 2)
    return "Колесо вы только что видели. Просело больше половины сфер, тяжелее всего здесь: " + names + ". Дальше про то, что с этим делать.";

  return "Колесо вы только что видели. Где-то у вас в порядке, а где-то пусто, и сильнее всего просело здесь: " + names + ". Дальше про то, что с этим делать.";
}

/* Прямой вердикт. Человек только что увидел свою фигуру и разбор по сферам,
   и ему не нужен пересказ графика. Ему нужно услышать, плохо у него или нет.

   Считается по тому же числу, что и лучи с подписями: сколько остаётся вам.
   Плюс называется количество просевших сфер: это цифра, которую человек
   тут же сверяет со своим колесом, и она у всех разная. Без неё четыре
   очень разных человека получали один и тот же текст.

   Число всегда в предложном падеже, «в N сферах»: так не нужно согласовывать
   окончание под 2, 5 и 6, и фраза не сломается ни на одном значении.

   Переход на программу вердикт не тянет: он ставит диагноз и замолкает,
   дальше говорит переход. */
function verdict(r, sag) {
  const n = sag.length, всего = r.wheel.length;

  if (n === всего)
    return "Скажу прямо. Дело плохо. Пусто у вас во всех шести сферах. Вы отдаёте много, а себе не оставляете почти ничего, и живёте так не первый год.";

  if (r.inn <= 3)
    return "Скажу прямо. Дело плохо. Пусто в " + n + " сферах из шести. Вы отдаёте много, а себе оставляете то, что не успели забрать, и держится это не первый год.";

  if (r.inn <= 5)
    return "Скажу прямо. Вам достаётся мало. Пусто в " + n + " сферах из шести: отдаёте вы заметно больше, чем получаете обратно.";

  if (n)
    return "Скажу прямо. В целом вы держитесь, и это уже много. Но в " + n + " сферах из шести у вас пусто, и само это не проходит.";

  /* Не просело ничего. Диагноз ставить не на чем, поэтому опираемся
     на то, что человек сказал сам. */
  const назвал = r.wheel.filter(c => c.k === (forks && forks.bol))[0];
  if (назвал)
    return "Скажу прямо. С колесом у вас порядок, так бывает нечасто. И при этом вы сами написали, что тяжелее всего сейчас вот здесь: " + назвал.s + ".";
  return "Скажу прямо. С колесом у вас порядок, так бывает нечасто. Слабее других те сферы, где луч самый короткий.";
}

/* ——— состояние ——— */
let stage = "intro";      // intro | q | fork | result
let idx = 0;
const answers = [];
const forks = {};
let startedAt = 0;   // засекаем на первом вопросе, чтобы отличить честное прохождение от прокликанного
let lastResult = null;

const screen = document.getElementById("screen");
const dial = document.getElementById("dial");
const counter = document.getElementById("counter");

function paintDial() {
  /* Шкала прогресса — часть теста. На оффере, форме и выборе оплаты
     показывать нечего: у пришедшего по прямой ссылке теста не было,
     а у прошедшего он уже позади. Полоса из двадцати четырёх клеток
     там читается как незаконченное дело. */
  const вТесте = stage === "intro" || stage === "q" || stage === "fork" || stage === "result";
  dial.style.display = вТесте ? "" : "none";
  if (!вТесте) { counter.textContent = ""; return; }

  const total = Q.length + FORKS.length;
  const done = stage === "result" ? total : (stage === "fork" ? Q.length + idx : idx);
  let html = "";
  for (let i = 0; i < total; i++) {
    html += '<span class="tick' + (i < done ? " done" : (i === done ? " now" : "")) + '"></span>';
  }
  dial.innerHTML = html;
  counter.textContent = stage === "q" ? (idx + 1) + " / " + Q.length
    : stage === "fork" ? "почти всё"
    : stage === "result" ? "результат" : "";
}

/* ——— подсчёт ———
   По каждой сфере две величины по десятибалльной шкале: сколько отдаю
   и сколько остаётся. Ответы четырёхступенчатые, поэтому 0, 3, 7, 10.
   Зазор между ними и есть цена привычки быть удобным в этой сфере. */
const STEP = [0, 3, 7, 10];

function score() {
  const by = {};
  SPHERES.forEach(x => by[x.k] = { k: x.k, t: x.t, o: [], i: [] });

  Q.forEach((q, i) => {
    const v = typeof answers[i] === "number" ? answers[i] : 0;
    by[q.sf][q.g === "out" ? "o" : "i"].push(STEP[v]);
  });

  /* Каждая ось это среднее из двух ответов: один неверно прочитанный вопрос
     не должен перекашивать целый луч колеса. */
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0;
  const wheel = SPHERES.map(x => {
    const c = by[x.k];
    const out = avg(c.o), inn = avg(c.i);
    return { k: c.k, t: c.t, s: x.s, out: out, inn: inn, gap: out - inn };
  });

  const out = Math.round(wheel.reduce((a, c) => a + c.out, 0) / wheel.length);
  const inn = Math.round(wheel.reduce((a, c) => a + c.inn, 0) / wheel.length);

  /* Две сферы с самым большим зазором. При равенстве вперёд идёт та,
     где меньше остаётся: там человеку и больнее. */
  const worst = wheel.slice().sort(function (a, b) {
    return (b.gap - a.gap) || (a.inn - b.inn);
  }).slice(0, 2);

  return { wheel: wheel, out: out, inn: inn, gap: out - inn, worst: worst };
}

/* ——— колесо ———
   Обычный SVG, без библиотек: шесть осей, два замкнутых контура.
   Внутренний контур появляется анимацией из полного размера в реальный —
   человек своими глазами видит, как сжимается то, что остаётся ему.
   Анимация на requestAnimationFrame, потому что она должна работать
   и на старых вебвью, где нет ни современного CSS, ни SMIL. */
const R = 84, CX = 160, CY = 112;

/* Пол для отрисовки внутреннего контура. При нулевых ответах многоугольник
   схлопывается в точку и линия просто исчезает, а исчезнуть она не должна:
   именно её сжатие и есть содержание экрана. Числа под колесом при этом
   настоящие, пол влияет только на картинку. */
const FLOOR = 0.5;

function poly(vals, floor) {
  return vals.map(function (v, i) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const r = R * (Math.max(v, floor || 0) / 10);
    return (CX + r * Math.cos(a)).toFixed(1) + "," + (CY + r * Math.sin(a)).toFixed(1);
  }).join(" ");
}

function wheelSvg(w) {
  const axes = w.map(function (c, i) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
    const lx = CX + (R + 18) * Math.cos(a), ly = CY + (R + 18) * Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.1 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    return '<line x1="' + CX + '" y1="' + CY + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" class="ax"/>' +
           '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" class="axt">' + c.t + '</text>';
  }).join("");

  const rings = [10, 6.7, 3.3].map(function (v) {
    return '<polygon points="' + poly([v,v,v,v,v,v]) + '" class="ring"/>';
  }).join("");

  /* Контур один: сколько остаётся вам. Второй, «сколько отдаёте», убран
     сознательно. Человеку не нужно сравнивать две фигуры, чтобы понять,
     что где-то пусто: пустое место между кольцом и фигурой говорит это само.
     Фигура начинается с полного кольца и сдувается до настоящего размера,
     так видно, сколько ушло. */
  return '<svg viewBox="0 0 320 228" class="wheel" role="img" aria-label="Колесо: сколько остаётся вам по шести сферам жизни">' +
    rings + axes +
    '<polygon id="inn" points="' + poly([10, 10, 10, 10, 10, 10]) + '" class="inn"/>' +
    '</svg>';
}

/* Сдуваем внутренний контур от внешнего к настоящему. Полторы секунды:
   быстрее не читается как движение, медленнее человек теряет интерес. */
function animateWheel(node, w) {
  const el = node.querySelector("#inn");
  if (!el) return;
  const from = w.map(function () { return 10; });
  const to = w.map(function (c) { return c.inn; });
  let t0 = 0;
  function step(ts) {
    if (!t0) t0 = ts;
    let k = Math.min(1, (ts - t0) / 1500);
    k = 1 - Math.pow(1 - k, 3);
    el.setAttribute("points", poly(from.map(function (v, i) { return v + (to[i] - v) * k; }), FLOOR));
    if (k < 1) requestAnimationFrame(step);
  }
  if (window.requestAnimationFrame) requestAnimationFrame(step);
  else el.setAttribute("points", poly(to, FLOOR));   // без анимации, но результат верный
}

/* ——— экраны ——— */
function el(html) {
  const d = document.createElement("div");
  d.className = "fade";
  d.innerHTML = html;
  return d;
}

/* Имя из Телеграма подставляется в разметку. Кавычка в имени рвала атрибут
   value и оставляла поле пустым — а такие имена в Телеграме встречаются. */
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
}

/* Без replaceChildren: он появился только в Chrome 86 (конец 2020),
   а на неподновлённых Android его нет — и падал весь скрипт, экран оставался белым. */
function render(node) {
  while (screen.firstChild) screen.removeChild(screen.firstChild);
  screen.appendChild(node);
  paintDial();
  toTop();
}

/* Каждый новый экран показываем с начала — иначе человек попадает
   на середину длинного текста и не понимает, что сменилось. */
function toTop() {
  try {
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  } catch (e) {}
}

function question() {
  stage = "q";

    </div>`);

  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    answers[idx] = Number(b.dataset.v);

function fork() {
  stage = "fork";
  const f = FORKS[idx];
  const n = el(`
    <div class="card">
      <div class="step">Ещё ${FORKS.length - idx} ${FORKS.length - idx === 1 ? "вопрос" : "вопроса"}</div>

        ${f.a.map((o, i) => `<button class="ans" data-i="${i}">${o[0]}</button>`).join("")}
      </div>
    </div>`);
  n.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => {
    const pick = f.a[Number(b.dataset.i)]; forks[f.k] = pick[1]; forks[f.k + "_text"] = pick[0];
    idx++;
    saveState();
    if (idx < FORKS.length) fork(); else result();
  }));
  render(n);
}

function result(prev) {
  stage = "result";
  const r = prev || score();
  lastResult = r;
  /* Подробно разбираем две самые пустые сферы: те же, что тоньше всего
     на колесе. При равенстве вперёд идёт та, где разрыв с «отдаю» больше.
     Если пустых нет, разбирать нечего и блок не показывается. */
  const sag = sagging(r);

  const n = el(`
    <div class="card">

      <p class="bridge">${verdict(r, sag)}</p>
      <!-- Мост с результата на событие. Отбит жирной линией и крупным
           заголовком-вопросом: люди писали, что события просто не замечали.
           Текст опирается на то, что человек только что увидел на колесе,

        <p class="jump-t"><b>1 октября у Виолы Маро стартует практикум для эмпатов «Прикладная эмпатия». Его задача — научить вас пользоваться своей эмпатией во благо себе.</b></p>
        <p class="jump-t">Сейчас идёт предзапись. До 18 сентября действует самая низкая цена, с 19 сентября она вырастет. Заявка бесплатная и ни к чему не обязывает.</p>
      </div>
      <div class="foot">
        <button class="go big cta-top" id="offer">Что за Прикладная эмпатия?&nbsp;<span aria-hidden="true">→</span></button>

function lead(r) {

        </label>
        <label class="cb">
          <input type="checkbox" id="cb-ads">
          <span>Я хочу получать письма и сообщения о программах и эфирах. Отписаться можно в один клик. <a href="${CONFIG.docs.ads}" target="_blank" rel="noopener">Условия рассылки</a></span>

      <div class="foot">
        <button class="go big" id="send">Отправить заявку&nbsp;<span aria-hidden="true">→</span></button>
        <p class="cta-note" id="hint">Команда Виолы напишет вам в Телеграм.</p>
        <!-- Отдельным абзацем: подсказки валидации перетирают #hint, а это обещание должно оставаться на экране. -->
        <p class="cta-note">После записи вас перекинет в обещанный Телеграм-канал.</p>
        <button class="ghost" id="back-offer">← Назад</button>
      </div>
    </div>`);

  const nameEl = n.querySelector("#f-name");
  const tgEl = n.querySelector("#f-tg");
  const btn = n.querySelector("#send");
  const hint = n.querySelector("#hint");
  const ask = n.querySelector("#ask");
  const pd = n.querySelector("#cb-pd");
  const pdLabel = n.querySelector("#cb-pd-l");
  const ads = n.querySelector("#cb-ads");
  const askNote = n.querySelector("#ask-need");
  const hintText = hint ? hint.textContent : "";
  let talk = "";

  /* Снимаем предупреждение молча, как только человек исправил. */
  function clearWarn() {
    if (ask) ask.classList.remove("need");
    if (askNote) askNote.hidden = true;
    if (hint) { hint.classList.remove("err"); hint.textContent = hintText; }
    nameEl.classList.remove("err");
    tgEl.classList.remove("err");
    if (pdLabel) pdLabel.classList.remove("err");
  }

  function warn(msg) {
    if (!hint) return;
    hint.textContent = msg;
    hint.classList.add("err");
  }

  n.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    talk = c.dataset.v;

    clearWarn();
  }));
  if (pd) pd.addEventListener("change", () => { if (pd.checked) clearWarn(); });
  [nameEl, tgEl].forEach(f => f.addEventListener("input", () => {
    if (f.value.trim()) f.classList.remove("err");
  }));

  btn.addEventListener("click", () => {
    const name = (nameEl.value || "").trim();
    const contact = (tgEl.value || "").trim();
    if (!name || !contact) {
      if (!name) nameEl.classList.add("err");
      if (!contact) tgEl.classList.add("err");
      warn("Заполните оба поля — иначе не сможем вас позвать.");
      (name ? tgEl : nameEl).focus();
      return;
    }
    if (!talk) {
      /* Главная причина «нажал, и ничего не происходит»: вопрос выше кнопки,
         человек его пролистал. Поэтому подсвечиваем сам вопрос и подводим к нему экран. */
      if (ask) {
        ask.classList.add("need");

        if (ask.scrollIntoView) ask.scrollIntoView({ behavior: "smooth", block: "center" });

      return;

      pdLabel.classList.add("err");
      if (pdLabel.scrollIntoView) pdLabel.scrollIntoView({ behavior: "smooth", block: "center" });
      warn("Отметьте согласие на обработку персональных данных.");
      return;
    }
    clearWarn();
    btn.disabled = true;
    btn.textContent = "Отправляю…";
    запомнитьКонтакт_(name, contact);
    sendLead(r, name, contact, talk, { pd: !!(pd && pd.checked), ads: !!(ads && ads.checked) });
    /* Сначала рисуем «Готово», потом уводим в канал: если окно всё-таки
       откроется поверх, экран подтверждения человек уже увидел. */
    done();
    openChannel();   // обещали «сразу после записи» — открываем сами
  });
  n.querySelector("#back-offer").addEventListener("click", () => offer(r));
  render(n);
}

/* Заявка в предзапись на практикум. Имя и контакт уходят и отдельными
   полями тоже: это единственное место, где у нас появляется контакт
   человека, и сервер раскладывает их по колонкам — чтобы заявку можно
   было найти поиском, а дубли склеить. */
function sendLead(r, name, contact, talk, consent) {
  /* Своё место в счётчике. Единственная настоящая единица в нём. */
  try { localStorage.setItem("viola-kl-zayavka", "1"); } catch (e) {}
  track_("lead", {
    anketa: "predzapis",
    name: name, contact: contact, ready: talk || "",
    /* r отсутствует, когда человек пришёл по прямой ссылке на оффер и
       теста не проходил. Тогда колеса нет, и вместо цифр ставим метку —
       по ней видно, откуда пришёл лид. */
    otdayu: r ? r.out : "",
    ostaetsya: r ? r.inn : "",
    worst: r ? r.worst.map(c => c.k).join(",") : "",
    /* Не путать с source: тот говорит, из какого канала человек пришёл,
       а это — прошёл он тест или сразу открыл витрину. */
    otkuda: r ? "test" : "pryamaya-ssylka",
    forks: forks,
    /* Акцепт фиксируем так же, как на сайте: сами галочки, время и редакция документа. */
    accept_pd: consent && consent.pd ? "да" : "",
    accept_ads: consent && consent.ads ? "да" : "",
    consent_ts: new Date().toISOString(),
    doc_version_consent: CONFIG.docVersionConsent || ""
  }, { name: name, contact: contact });
}

/* ——— форма перед оплатой на событие ———
   Нужна не ради контакта: оплата его и так соберёт. Нужна затем, чтобы команда
   знала, кого ждать, и заметила человека, у которого оплата прошла, а доступ нет.
   Поэтому здесь же и снимаются тревоги «а что после оплаты» и «а если не придёт». */
/* ——— контакт человека, чтобы не набирать его дважды ———
   Телеграм отдаёт имя и логин только внутри мини-аппа. По обычной ссылке
   из браузера — а ею мы и делимся — не отдаёт ничего, и поля пустые.
   Поэтому то, что человек ввёл сам, помним в его же браузере и
   подставляем на следующем заходе. Данные никуда не уходят: это
   localStorage, он живёт только на его устройстве. */
const KONTAKT_KEY = "viola-kl-kontakt";

function вспомнитьКонтакт_() {
  try { return JSON.parse(localStorage.getItem(KONTAKT_KEY) || "{}") || {}; }
  catch (e) { return {}; }
}
function запомнитьКонтакт_(имя, ник) {
  try { localStorage.setItem(KONTAKT_KEY, JSON.stringify({ имя: имя, ник: ник })); }
  catch (e) {}
}

/* Ник приводим к одному виду. Люди пишут «@name», «name» и целую ссылку
   «t.me/name» — в таблице это три разных значения одного человека, и
   команда потом ищет его руками. */
function ник_(v) {
  let x = String(v || "").trim();
  if (!x) return "";
  x = x.replace(/^https?:\/\//i, "").replace(/^t\.me\//i, "").replace(/^@+/, "");
  x = x.split(/[?\/\s]/)[0];
  return x ? "@" + x : "";
}
